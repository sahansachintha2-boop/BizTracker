<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BizTrack">
<meta name="application-name" content="BizTrack">
<meta name="description" content="BizTrack – Track Money. Stay in Control. Simple and smart money management for individuals and small businesses.">
<title>BizTrack – Track Money. Stay in Control.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB; --sheet:#FFFFFF; --ink:#14233A; --muted:#5A6A80; --rule:#D6DEE9; --rule2:#E9EEF5;
  --blue:#1B5FAA; --navy:#0A2A5E; --blue-soft:#E3EDF9; --grid:rgba(27,95,170,.055);
  --inc:#1B7A48; --inc-soft:#E2F3EA; --exp:#B03A2E; --exp-soft:#F8E6E3; --warn:#A96F12; --warn-soft:#FBF0DA; --loan:#5B4BB0; --loan-soft:#ECE9FA; --sav:#1B5FAA; --sav-soft:#E3EDF9;
  --font:'IBM Plex Sans','Noto Sans Sinhala',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; --side:264px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0D1625; --sheet:#142136; --ink:#E4ECF7; --muted:#95A5BB; --rule:#2A3B57; --rule2:#1D2C45;
  --blue:#72AAE9; --navy:#0A1E3A; --blue-soft:#1B3050; --grid:rgba(114,170,233,.05);
  --inc:#5FC48D; --inc-soft:#16362A; --exp:#EE8577; --exp-soft:#3A1F1C; --warn:#E5B45C; --warn-soft:#3A2F17; --loan:#A99BF0; --loan-soft:#29244A; --sav:#72AAE9; --sav-soft:#1B3050;
}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.inc{color:var(--inc)} .exp{color:var(--exp)} .muted{color:var(--muted)} .loanc{color:var(--loan)} .warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:54px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.hbtn svg{width:18px;height:18px}
.syncdot{width:8px;height:8px;border-radius:50%;background:#8a9bb3}
.syncdot.ok{background:#5FD49A}.syncdot.syncing{background:#F3C969;animation:pulse 1s infinite}.syncdot.error{background:#F28B7D}
@keyframes pulse{50%{opacity:.3}}

/* drawer / sidebar */
.drawer{position:fixed;top:0;bottom:0;left:0;width:var(--side);max-width:86%;background:var(--sheet);z-index:42;border-right:1px solid var(--rule);overflow-y:auto;
  transform:translateX(-102%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s;padding:env(safe-area-inset-top,0px) 0 calc(16px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none;visibility:visible;transition:transform .2s ease}
.brand{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--navy);color:#fff}
.brand img{width:34px;height:34px;border-radius:8px}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}.brand small{opacity:.8;font-size:11.5px}
.bt-g{background:linear-gradient(90deg,#5BE86F,#16C9A3);-webkit-background-clip:text;background-clip:text;color:transparent}
.devline{padding:12px 16px 0;font-size:11.5px;color:var(--muted)}
.about{text-align:center;padding:22px 18px 8px}
.about img{width:150px;height:150px;filter:drop-shadow(0 10px 22px rgba(10,42,94,.28))}
.about h2{margin:12px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.about .tag1{color:var(--muted);font-weight:500;margin-top:2px}
.about p{text-align:left;font-size:14.5px;line-height:1.65;margin:12px 0 0}
.about .slogan{text-align:center;font-weight:700;margin:16px 0 4px;font-size:15px}
.devcard .kv a{color:var(--blue);font-weight:600;text-decoration:none}
.navg{padding:6px 8px 2px}
.navg h4{font-size:12px;color:var(--muted);margin:8px 12px 2px;font-weight:500}
.navi{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;text-align:left;color:var(--ink)}
.navi svg{width:20px;height:20px;flex:none;color:var(--muted)}
.navi:hover{background:var(--rule2)}
.navi.on{background:var(--blue-soft);color:var(--blue);font-weight:600}.navi.on svg{color:var(--blue)}
.scrim{position:fixed;inset:0;background:rgba(8,18,34,.45);z-index:40;display:none}
.scrim.open{display:block}

main{max-width:780px;margin:0 auto;padding:14px 14px 130px}
section.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.panel > h3{font-size:14px;font-weight:600;margin:0;padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{color:var(--blue);font-weight:500;font-size:13px;cursor:pointer;background:none;border:0;padding:0}
.pad{padding:0 14px 14px}
.backlink{background:none;border:0;color:var(--blue);font-weight:500;cursor:pointer;padding:2px 0 10px;font-size:14px}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.monthbar{display:flex;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.monthbar button{border:0;background:none;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--blue)}
.monthbar b{font-weight:600;min-width:128px;text-align:center;font-size:14px}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1;padding:9px}
.seg button.on.income{background:var(--inc-soft);color:var(--inc)}
.seg button.on.expense{background:var(--exp-soft);color:var(--exp)}
.bar input,.bar select{width:auto;padding:7px 9px;font-size:14px}

/* statement */
.stmt{padding:16px 16px 18px}
.stmt .line{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;gap:10px}
.stmt .line .num{font-size:16px}
.stmt .line.minor{font-size:14px;padding:3px 0}.stmt .line.minor .num{font-size:14.5px}
.stmt .total{margin-top:6px}
.stmt .total span:first-child{font-weight:600}
.stmt .total .num{font-size:25px;font-weight:700;border-top:1.5px solid var(--ink);border-bottom:4px double var(--ink);padding:4px 0 1px;min-width:58%;text-align:right}
.stmt .sub{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stmt .sub b{color:var(--ink);font-weight:600}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--rule2)}
.rows li.click{cursor:pointer}.rows li.click:hover{background:var(--blue-soft)}
.rows .main{flex:1;min-width:0}
.rows .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .amt{font-weight:600;text-align:right}
.rows .amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.daystrip{display:flex;justify-content:space-between;padding:7px 14px;background:var(--rule2);font-size:12.5px;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--blue-soft);color:var(--blue);margin-right:4px;font-weight:500}
.tag.biz{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--exp-soft);color:var(--exp)}.tag.good{background:var(--inc-soft);color:var(--inc)}.tag.ln{background:var(--loan-soft);color:var(--loan)}
.clip{width:14px;height:14px;vertical-align:-2px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

.prog{height:8px;background:var(--rule2);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px}
.prog.near i{background:var(--warn)}.prog.over i{background:var(--exp)}.prog.good i{background:var(--inc)}.prog.ln i{background:var(--loan)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--rule2);font-size:13.5px}
.alert.click{cursor:pointer}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--blue)}
.alert.near .dot{background:var(--warn)}.alert.over .dot{background:var(--exp)}
.hbar{padding:8px 14px}
.hbar.bt{border-top:1px solid var(--rule2);padding:12px 14px}
.hbar .top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;align-items:baseline}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:780px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 372px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:16px;border:0;background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(18,58,107,.35);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}.fab[hidden]{display:none}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--sheet);border-radius:16px 16px 0 0;max-height:92%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;max-width:640px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
#sscrim{z-index:50}
@media (prefers-reduced-motion:reduce){.sheet,.drawer{transition:none}.syncdot.syncing{animation:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 10px}
.sheet h2{font-size:18px;margin:0 0 12px;font-weight:600}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 11px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input[type=checkbox]{width:auto}
.amtin{font-size:28px;font-weight:600;padding:8px 12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;flex:1}
.btn.danger{color:var(--exp);border-color:var(--exp-soft)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn svg{width:18px;height:18px}
.filebox{border:1.5px dashed var(--rule);border-radius:9px;padding:12px;display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
.filebox img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.filebox .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.receiptview img{max-width:100%;border-radius:8px;border:1px solid var(--rule)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule2);font-size:14px}

.chart{padding:4px 10px 8px}.chart svg{width:100%;height:auto;max-height:240px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 14px;border-top:1px solid var(--rule2)}
.tbl td:not(:first-child){text-align:right}
.tbl.nw td{white-space:nowrap}
.tbl tr.h td{font-weight:600;background:var(--rule2);border-top:0;font-size:13px}
.tbl tr.tot td{font-weight:600;border-top:1.5px solid var(--ink)}
.tbl tr.net td{font-weight:700;font-size:16px;border-top:1.5px solid var(--ink);border-bottom:4px double var(--ink)}
.exportbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 14px}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.toast.show{display:block}.toast.warn{background:var(--warn);color:#fff}.toast.bad{background:var(--exp);color:#fff}
details.sql summary{cursor:pointer;color:var(--blue);font-size:13.5px;font-weight:500}
pre.code{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px;font-size:11.5px;overflow-x:auto;white-space:pre}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.row2{display:flex;gap:8px;align-items:center}.row2 input{flex:1}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}
#printArea{display:none}

@media (min-width:960px){
  .drawer{transform:none;visibility:visible;z-index:15;max-width:none;transition:none}
  #dscrim,.menuBtn{display:none!important}
  header,main{margin-left:var(--side)}
  main{max-width:none;padding:20px 32px 100px}
  #view{max-width:820px}
  nav.tabs{display:none}
  .fab{bottom:28px;right:32px}
  .toast{bottom:40px}
}

/* ================= MODERN UI ================= */
.ic{display:contents}
#modeSw{display:none}
.kpis,.dgrid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
.dgrid{grid-template-columns:minmax(0,1fr)}
.dgrid > *,.dgrid section.panel{margin-bottom:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 14px 12px;cursor:pointer;min-width:0;text-align:left;width:100%;color:var(--ink);
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.18)}
.kpi-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.kpi-ic,.chip{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--cs,var(--blue-soft));color:var(--c,var(--blue));flex:none}
.kpi-ic svg,.chip svg{width:17px;height:17px}
.kpi-val{font-size:clamp(17px,4.8vw,26px);font-weight:700;margin-top:12px;letter-spacing:-.01em;color:var(--c,var(--ink));overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:3px}
.chg{font-weight:600;padding:1px 6px;border-radius:999px;font-size:11.5px}
.chg.good{color:var(--inc);background:var(--inc-soft)}.chg.bad{color:var(--exp);background:var(--exp-soft)}
.inc-c{--c:var(--inc);--cs:var(--inc-soft)}.exp-c{--c:var(--exp);--cs:var(--exp-soft)}.acc-c{--c:var(--blue);--cs:var(--blue-soft)}
.sav-c{--c:var(--sav);--cs:var(--sav-soft)}.loan-c{--c:var(--loan);--cs:var(--loan-soft)}.warn-c{--c:var(--warn);--cs:var(--warn-soft)}.net-c{--c:var(--ink);--cs:var(--rule2)}.mut-c{--c:var(--muted);--cs:var(--rule2)}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 14px 14px}
.acard{border:1px solid var(--rule);border-radius:14px;padding:12px;cursor:pointer;background:var(--sheet);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-width:0}
.acard:hover{border-color:var(--blue)}
.acard .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .num{font-weight:700;font-size:16px}
.acard small{color:var(--muted);font-size:11.5px}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 14px 14px}
.mini{border-radius:12px;padding:10px 12px;background:var(--cs);cursor:pointer;border:0;text-align:left;color:var(--ink)}
.mini span{font-size:12px;color:var(--muted);display:block}.mini b{font-size:15px;color:var(--c)}
.donut{display:flex;gap:14px;align-items:center;padding:4px 16px 16px;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.donut ul{list-style:none;margin:0;padding:0;flex:1;min-width:140px;font-size:13px}
.donut li{display:flex;gap:8px;align-items:center;padding:3px 0}
.donut li i{width:9px;height:9px;border-radius:3px;flex:none}
.donut li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uipick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uiopt{border:2px solid var(--rule);border-radius:14px;background:var(--sheet);padding:8px;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.uiopt.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.uiopt b{font-size:14px}.uiopt small{font-size:11.5px;color:var(--muted);line-height:1.35}
.prev{display:block;height:84px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--rule)}
.prev-classic{background:#F4F7FB;background-image:linear-gradient(rgba(27,95,170,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(27,95,170,.09) 1px,transparent 1px);background-size:8px 8px}
.prev-classic::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:#123A6B}
.prev-classic::after{content:"";position:absolute;right:10px;left:40%;top:44px;height:10px;border-top:1.5px solid #14233A;border-bottom:4px double #14233A}
.prev-modern{background:#F4F6FA}
.prev-modern::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:#fff;border-right:1px solid #E4E8EF}
.prev-modern i{position:absolute;top:12px;width:22%;height:26px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prev-modern i::after{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:3px;background:var(--pc)}

function flows(x){
 if(x.type==='income')return[[x.method,x.amount]];
 if(x.type==='expense')return[[x.method,-x.amount]];
 if(x.type==='transfer')return[[x.method,-x.amount],[x.to,x.amount]];
 if(x.type==='loan'){const l=D.loans[x.loanId];const s=(l&&l.dir==='lent')?-1:1;return[[x.method,(x.kind==='disb'?s:-s)*x.amount]]}

function balances(before){const b={};acts().forEach(m=>b[m.id]=m.type==='credit'?-(+m.opening||0):(+m.opening||0));
 for(const x of txList()){if(before&&x.date>=before)continue;for(const [a,v] of flows(x))b[a]=(b[a]||0)+v}return b}
function totals(pred){let inc=0,exp=0;for(const x of txList()){if(!pred(x))continue;if(x.type==='income')inc+=x.amount;else if(x.type==='expense')exp+=x.amount}return{inc,exp,net:inc-exp}}

/* ---- 2 & 3. Income / Expenses ---- */

 ${rows.length?`<h3 style="font-size:14px;margin:0;padding:0 14px 4px">${t('byCat')}</h3>${rows.map(([c,v])=>`<div class="hbar"><div class="top"><span>${esc(catName(c))}</span><span class="num">${money(v)} <span class="muted">${Math.round(v/tot*100)}%</span></span></div><div class="prog ${type==='income'?'good':'over'}"><i style="width:${v/rows[0][1]*100}%"></i></div></div>`).join('')}<div style="height:10px"></div>`:''}</section>

   return `<li class="click" data-act="openAcc" data-v="${a.id}"><div class="main"><div class="t1">${esc(nm(a))}</div>${ty==='credit'&&a.limit>0?`<div class="t2">${t('available')}: ${money(a.limit+v)}</div>`:''}</div><div class="amt num ${v<0&&ty!=='credit'?'exp':''}">${ty==='credit'?signed(-v)+`<small>${t('owed')}</small>`:signed(v)}</div></li>`}).join('')}</ul>`}).join('');

function accMoves(id){return txList().filter(x=>flows(x).some(f=>f[0]===id))}

 <div class="line"><span>${t('outflow')}</span><span class="num exp">(${money(sum(list,x=>sum(flows(x).filter(f=>f[0]===a.id&&f[1]<0),f=>-f[1])))})</span></div>
 <div class="line total"><span>${cr?t('owed'):t('closeBal')}</span><span class="num ${!cr&&cb<0?'exp':''}">${cr?signed(-cb):signed(cb)}</span></div>

/* ---- 10. Goals ---- */
function monthsUntil(d){const a=new Date(),b=new Date(d+'T00:00:00');return Math.max(1,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()))}
function vGoals(){

 return `${gs.length?`<section class="panel hero-sav"><div class="stmt"><div class="line"><span>${t('target')}</span><span class="num">${money(tt)}</span></div><div class="line total"><span>${t('saved')}</span><span class="num inc">${money(ts)}</span></div></div></section>`:''}
 <section class="panel"><h3>${t('goals')}<button class="linkbtn" data-act="newGoal">+ ${t('addGoal')}</button></h3>
 ${gs.length?gs.map(g=>{const p=g.target>0?g.saved/g.target:0;const need=g.deadline&&p<1?(g.target-g.saved)/monthsUntil(g.deadline):0;
 return `<div class="hbar bt"><div class="top"><b style="font-weight:600;cursor:pointer" data-act="editGoal" data-v="${g.id}">${esc(g.name)}</b><span class="num">${Math.round(p*100)}%</span></div>
 <div class="prog ${p>=1?'good':'sav'}"><i style="width:${Math.min(100,p*100)}%"></i></div>
 <div class="top note"><span class="num">${money(g.saved)} / ${money(g.target)}</span><span>${p>=1?`<span class="inc">${t('reached')}</span>`:g.deadline?`${t('perMonth')}: <b class="num">${money(need)}</b>`:''}</span></div>
 <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" data-act="contrib" data-v="${g.id}">+ ${t('contribute')}</button>${g.deadline?`<span class="note" style="margin:0">${t('deadline')}: ${dayLabel(g.deadline)}</span>`:''}</div></div>`}).join(''):`<div class="empty">${t('noGoal')}</div>`}</section>`}

/* ---- 11. Reports ---- */
function rRange(){const m=S.rMode;
 if(m==='day')return{from:S.rDay,to:S.rDay,label:dayLabel(S.rDay),file:S.rDay};
 if(m==='year')return{from:S.rYear+'-01-01',to:S.rYear+'-12-31',label:S.rYear,file:S.rYear};
 if(m==='custom'){let a=S.rFrom,b=S.rTo;if(a>b)[a,b]=[b,a];return{from:a,to:b,label:dayLabel(a)+' – '+dayLabel(b),file:a+'_'+b}}
 return{from:S.month+'-01',to:monthEnd(S.month),label:monthLabel(S.month),file:S.month}}
function reportData(){
 const R=rRange(),sc=curScope();
 const list=txList().filter(x=>x.date>=R.from&&x.date<=R.to&&(x.type==='transfer'||x.type==='loan'||inScope(x,sc))).sort((a,b)=>a.date.localeCompare(b.date));
 const inc={},exp={},acc={},daily={};let ti=0,te=0;
 for(const x of list){
  if(x.type==='income'||x.type==='expense'){const o=x.type==='income'?inc:exp;o[x.cat]=(o[x.cat]||0)+x.amount;if(x.type==='income')ti+=x.amount;else te+=x.amount;const d=daily[x.date]=daily[x.date]||{inc:0,exp:0};d[x.type==='income'?'inc':'exp']+=x.amount}
  for(const [a,v] of flows(x)){const o=acc[a]=acc[a]||{i:0,o:0};if(v>0)o.i+=v;else o.o-=v}}
 const srt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
 return{R,list,inc:srt(inc),exp:srt(exp),acc,daily,ti,te,net:ti-te}}
function trendSvg(r){
 const days=dayList(r.R.from,r.R.to);let b;
 if(days.length>62){const ms=[...new Set(days.map(ym))];b=ms.map(m=>{let i=0,e=0;for(const d in r.daily)if(ym(d)===m){i+=r.daily[d].inc;e+=r.daily[d].exp}return{lab:monthShort(m),i,e}})}
 else b=days.map(d=>({lab:String(+d.slice(8)),i:(r.daily[d]||{}).inc||0,e:(r.daily[d]||{}).exp||0}));
 const max=Math.max(1,...b.map(v=>Math.max(v.i,v.e))),W=340,H=170,P=18,bw=(W-P*2)/b.length,every=Math.ceil(b.length/12);
 const cs=getComputedStyle(document.documentElement),c=k=>cs.getPropertyValue(k).trim();
 let g=`<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="${c('--rule')}"/>`;
 b.forEach((v,i)=>{const x=P+i*bw,w=Math.max(1.5,bw*.36),hi=(H-P*2)*v.i/max,he=(H-P*2)*v.e/max;
  g+=`<rect x="${x+bw*.12}" y="${H-P-hi}" width="${w}" height="${hi}" rx="1.5" fill="${c('--inc')}"><title>${money(v.i)}</title></rect><rect x="${x+bw*.12+w+.5}" y="${H-P-he}" width="${w}" height="${he}" rx="1.5" fill="${c('--exp')}"><title>${money(v.e)}</title></rect>`;
  if(i%every===0)g+=`<text x="${x+bw/2}" y="${H-4}" font-size="9" text-anchor="middle" fill="${c('--muted')}">${esc(v.lab)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('trend')}">${g}</svg>`}
function vReports(){
 const r=reportData(),m=S.rMode,yrs=[...new Set([String(new Date().getFullYear()),...txList().map(x=>x.date.slice(0,4))])].sort().reverse();
 const sel=m==='day'?`<input type="date" id="rDay" value="${S.rDay}">`:m==='month'?monthBar():m==='year'?`<select id="rYear">${yrs.map(y=>`<option ${y===S.rYear?'selected':''}>${y}</option>`).join('')}</select>`:`<input type="date" id="rFrom" value="${S.rFrom}"><span class="muted">–</span><input type="date" id="rTo" value="${S.rTo}">`;
 const dRows=Object.keys(r.daily).sort();
 const pr=bizOn()?live(D.parties).map(p=>({p,s:partyStatus(p)})).filter(x=>Math.abs(x.s.balance)>0.004):[];
 const ln=live(D.loans).map(l=>({l,s:loanStatus(l)})).filter(x=>x.s.out>0.004);

 if(j.files)for(const id in j.files){try{const b=await (await fetch(j.files[id])).blob();await idb.put(id,b)}catch(e){}}

function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('c')),'image/jpeg',.75)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('i'))};img.src=u})}

/* ---- real PDF (canvas-rendered pages → JPEG → minimal PDF writer, no libraries) ---- */
function buildPdf(pages){
 const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
 const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
 const PW=595.28,PH=841.89,n=pages.length,total=2+n*3;
 push(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
 const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);body();push('\nendobj\n')};
 obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>push(`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${n} >>`));
 pages.forEach((pg,i)=>{const P=3+i*3,C=P+1,I=P+2,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(P,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>`));
  obj(C,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  obj(I,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpg.length} >>\nstream\n`);push(pg.jpg);push('\nendstream')})});
 const xref=len;push(`xref\n0 ${total+1}\n0000000000 65535 f \n`);
 for(let i=1;i<=total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
 return new Blob(chunks,{type:'application/pdf'})}

/* ================= Supabase sync ================= */
let syncing=false,syncState='local';
const sbBase=()=>L.sbUrl.trim().replace(/\/+$/,'');
const sbHead=()=>({apikey:L.sbKey.trim(),Authorization:'Bearer '+L.sbKey.trim()});
function setSync(s){syncState=s;syncUI()}
function syncUI(){const on=L.sbUrl&&L.sbKey&&L.ws;const s=on?(navigator.onLine?syncState:'offline'):'local';$('#syncDot').className='syncdot '+s;$('#syncTxt').textContent=s==='ok'?t('synced'):s==='offline'?t('offline'):s==='error'?'!':s==='syncing'?'…':t('local')}
async function sync(manual){
 if(!(L.sbUrl&&L.sbKey&&L.ws)){if(manual)toast(t('syncNotSet'),'warn');return}
 if(!navigator.onLine){setSync('offline');return}
 if(syncing)return;syncing=true;setSync('syncing');const start=now();
 try{const base=sbBase(),H={...sbHead(),'Content-Type':'application/json'};
  const withFiles=[...txList(),...live(D.bills)].filter(x=>x.receipt&&!L.uploaded.includes(x.receipt));
  for(const x of withFiles){let b=null;try{b=await idb.get(x.receipt)}catch(e){}if(!b)continue;
   const r=await fetch(`${base}/storage/v1/object/receipts/${encodeURIComponent(L.ws)}/${x.receipt}`,{method:'POST',headers:{...sbHead(),'Content-Type':b.type||'application/octet-stream','x-upsert':'true'},body:b});if(r.ok){L.uploaded.push(x.receipt);saveLocal()}}
  const rows=[],add=(kind,r)=>{if((r.updated||0)>(L.lastSync||0))rows.push({workspace:L.ws,id:r.id,kind,data:r,updated:r.updated,deleted:!!r.deleted})};
  for(const k in COLS)Object.values(D[k]).forEach(r=>add(COLS[k],r));add('config',D.config);
  for(let i=0;i<rows.length;i+=400){const r=await fetch(`${base}/rest/v1/et_records?on_conflict=workspace,id`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+400))});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120))}
  let off=0,changed=false;
  for(;;){const r=await fetch(`${base}/rest/v1/et_records?workspace=eq.${encodeURIComponent(L.ws)}&select=id,kind,data,updated&order=id&limit=1000&offset=${off}`,{headers:H});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
   const arr=await r.json();
   for(const row of arr){if(row.kind==='config'){if(row.updated>(D.config.updated||0)){D.config=row.data;changed=true}continue}
    const col=KIND2COL[row.kind];if(!col)continue;const cur=D[col][row.id];if(!cur||row.updated>(cur.updated||0)){D[col][row.id]=row.data;changed=true}}
   if(arr.length<1000)break;off+=1000}
  L.lastSync=start;saveLocal();if(changed){migrate();persist(false)}setSync('ok');if(manual)toast(t('syncOk'));if(changed||S.view==='backup')render();
 }catch(e){console.error(e);setSync('error');if(manual)toast(t('syncErr')+': '+e.message,'bad')}
 finally{syncing=false}}

 saveBudget:()=>{const lim=parseFloat(val('bLimit'));if(!(lim>0)){toast(t('errAmount'),'bad');return}const id=editId||uid();D.budgets[id]=touch({id,cat:val('bCat'),scope:val('bScope')||'all',limit:lim});persist();closeSheet();render()},
 delBudget:()=>{if(!confirm(t('delQ')))return;softDel('budgets',editId);persist();closeSheet();render()},
 newGoal:()=>goalSheet(null),editGoal:el=>goalSheet(el.dataset.v),
 saveGoal:()=>{const name=val('gName').trim(),tg=parseFloat(val('gTarget'));if(!name){toast(t('errName'),'bad');return}if(!(tg>0)){toast(t('errAmount'),'bad');return}const id=editId||uid(),old=D.goals[id]||{};D.goals[id]=touch({...old,id,name,target:tg,saved:parseFloat(val('gSaved'))||0,deadline:val('gDead'),log:old.log||[]});persist();closeSheet();render()},
 delGoal:()=>{if(!confirm(t('delQ')))return;softDel('goals',editId);persist();closeSheet();render()},
 contrib:el=>contribSheet(el.dataset.v),
 saveContrib:()=>{const a=parseFloat(val('cAmt'));if(!a){toast(t('errAmount'),'bad');return}const g=D.goals[editId];g.saved=r2(g.saved+a);(g.log=g.log||[]).push({d:today(),a});touch(g);persist();closeSheet();render();if(g.saved>=g.target)toast('🎉 '+g.name+': '+t('reached'))},
 addCat:()=>{const v=val('newCat').trim();if(!v)return;D.config.cats.push({id:'c_'+uid().slice(0,8),type:val('newCatType'),si:v,en:v});cfgTouch();render()},
 delCat:el=>{if(!confirm(t('delQ')))return;D.config.cats.find(x=>x.id===el.dataset.v).deleted=true;cfgTouch();render()},
 doBackup:()=>doBackup(),setRestore:el=>{restoreMode=el.dataset.v},
 genWs:()=>{$('#sbWs').value='biztrack-'+uid().replace(/-/g,'').slice(0,20)},
 saveSync:()=>{L.sbUrl=val('sbUrl').trim();L.sbKey=val('sbKey').trim();const w=val('sbWs').trim();if(w!==L.ws){L.ws=w;L.lastSync=0;L.uploaded=[]}saveLocal();sync(true)},
 sync:()=>sync(true),copySql:()=>{navigator.clipboard&&navigator.clipboard.writeText(SQL).then(()=>toast(t('copied')))},
 wipe:()=>{if(!confirm(t('wipeQ')))return;D=freshData();L.lastSync=0;L.uploaded=[];saveLocal();persist(false);try{indexedDB.deleteDatabase('ledger-files')}catch(e){}idb.db=null;S.view='dash';render()},
 csv:()=>exportCsv(),xlsx:()=>exportXlsx(),pdf:()=>exportPdf(),
 shareFile:()=>{if(PEND&&PEND.file)navigator.share({files:[PEND.file],title:PEND.name}).catch(e=>{if(e.name!=='AbortError')download(PEND.blob,PEND.name)})},
 dlFile:()=>{if(PEND)download(PEND.blob,PEND.name)},
 openFile:()=>{if(PEND){const u=URL.createObjectURL(PEND.blob);if(!window.open(u,'_blank'))location.href=u}},
 printRep:()=>{closeSheet();printReport()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;if(el.tagName!=='LABEL')e.preventDefault();a(el)});
document.addEventListener('change',e=>{const el=e.target,id=el.id;
 if(id==='fFile')onFile(el.files[0]);
 else if(id==='fScope'&&F&&F.form==='tx'){readTx();txSheet()}
 else if(id==='tAcc'){S.tAcc=el.value;render()}
 else if(id==='rYear'){S.rYear=el.value;render()}
 else if(id==='rDay'&&el.value){S.rDay=el.value;render()}
 else if((id==='rFrom'||id==='rTo')&&el.value){S[id]=el.value;render()}
 else if(id==='inclR')inclReceipts=el.checked;
 else if(id==='curSel'){const o=el.selectedOptions[0];D.config.currency={code:el.value,sym:o.dataset.sym||el.value};cfgTouch();render()}
 else if(id==='curSym'){D.config.currency.sym=el.value.trim()||D.config.currency.code;cfgTouch();render()}
 else if(el.classList.contains('restoreFile')&&el.files[0]){doRestore(el.files[0]);el.value=''}
});
let qT;document.addEventListener('input',e=>{if(e.target.id!=='qIn'||e.isComposing)return;S.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=$('#qIn').selectionStart;render();const q=$('#qIn');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}},300)});
document.addEventListener('compositionend',e=>{if(e.target.id==='qIn')e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else drawer(false)}});
addEventListener('online',()=>{syncUI();sync(false)});addEventListener('offline',syncUI);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync(false);
</script>
</body>
</html>
